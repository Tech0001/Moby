name: Build Electron App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            platform: mac
            arch: arm64
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (per-arch)
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "macOS" && "${{ matrix.arch }}" == "arm64" ]]; then
            npm ci
          elif [[ "${{ runner.os }}" == "macOS" && "${{ matrix.arch }}" == "x64" ]]; then
            arch -x86_64 npm ci
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            npm ci
          else
            npm ci
          fi

      - name: Build web/server
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "macOS" && "${{ matrix.arch }}" == "x64" ]]; then
            arch -x86_64 npm run build
          else
            npm run build
          fi

      - name: Rebuild native deps for Electron
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "mac" && "${{ matrix.arch }}" == "x64" ]]; then
            arch -x86_64 npx electron-builder install-app-deps --platform=darwin --arch=x64
          elif [[ "${{ matrix.platform }}" == "mac" && "${{ matrix.arch }}" == "arm64" ]]; then
            npx electron-builder install-app-deps --platform=darwin --arch=arm64
          elif [[ "${{ matrix.platform }}" == "win" ]]; then
            npx electron-builder install-app-deps --platform=win32 --arch=${{ matrix.arch }}
          else
            npx electron-builder install-app-deps --platform=linux --arch=${{ matrix.arch }}
          fi

      - name: Build Electron package
        run: |
          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            npx electron-builder --mac --${{ matrix.arch }}
          elif [[ "${{ matrix.platform }}" == "win" ]]; then
            npx electron-builder --win --${{ matrix.arch }}
          else
            npx electron-builder --linux --${{ matrix.arch }}
          fi
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moby-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
