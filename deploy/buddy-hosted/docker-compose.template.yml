# Moby buddy-hosted deployment template
# Copy this file and replace BUDDY_NAME with the user's subdomain prefix
# e.g., alice.moby.yourdomain.com

version: '3.8'

services:
  moby-BUDDY_NAME:
    build: ../..
    container_name: moby-BUDDY_NAME
    restart: unless-stopped
    networks:
      - moby-BUDDY_NAME-net
      - caddy-net
    volumes:
      - moby-BUDDY_NAME-data:/app/data
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
    labels:
      - "caddy=BUDDY_NAME.${DOMAIN}"
      - "caddy.reverse_proxy={{upstreams 3000}}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/setup/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  moby-BUDDY_NAME-net:
    driver: bridge
  caddy-net:
    external: true

volumes:
  moby-BUDDY_NAME-data:
